trigger:
- develop

pool:
  vmImage: ubuntu-latest

stages:

# ---------------- CI WORKFLOW ----------------

- stage: Build
  displayName: "CI - Build"
  jobs:
  - job: BuildJob
    steps:
    - script: echo "Build completed"
      displayName: "Build"

- stage: Test
  displayName: "CI - Test"
  dependsOn: Build
  jobs:
  - job: TestJob
    steps:
    - script: echo "Tests passed"
      displayName: "Test"

- stage: Publish
  displayName: "CI - Publish Artifact"
  dependsOn: Test
  jobs:
  - job: PublishJob
    steps:
    - script: echo "Artifact ready"
      displayName: "Publish"

# ---------------- CD WORKFLOW ----------------

- stage: Deploy_DEV
  displayName: "CD - Deploy DEV"
  dependsOn: Publish
  jobs:
  - job: DeployDevJob
    steps:
    - script: echo "Deployed to DEV"
      displayName: "Deploy DEV"

- stage: Deploy_UAT
  displayName: "CD - Deploy UAT"
  dependsOn: Deploy_DEV
  jobs:
  - job: DeployUatJob
    steps:
    - script: echo "Deployed to UAT"
      displayName: "Deploy UAT"

- stage: Deploy_PROD
  displayName: "CD - Deploy PROD"
  dependsOn: Deploy_UAT
  jobs:
  - job: DeployProdJob
    steps:
    - script: echo "Deployed to PROD"
      displayName: "Deploy PROD"

- stage: Final_Status
  displayName: "Final Status"
  dependsOn:
  - Build
  - Test
  - Publish
  - Deploy_DEV
  - Deploy_UAT
  - Deploy_PROD
  condition: always()
  jobs:
  - job: FinalStatusJob
    steps:
    - script: echo "Pipeline execution finished"
      displayName: "Final Status"

- stage: Publish
  displayName: "CI - Publish Artifact"
  dependsOn: Test
  jobs:
  - job: PublishJob
    steps:
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/output
        echo "Demo artifact generated by Azure DevOps" > $(Build.ArtifactStagingDirectory)/output/demo.txt
      displayName: "Create Demo Artifact"

    - task: PublishPipelineArtifact@1
      displayName: "Publish Demo Artifact"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/output'
        artifact: 'demo-artifac

variables:
- group: demo-variable-group

- name: BuildConfiguration
  value: 'Release'

- name: EnvironmentName
  value: 'Demo'

- name: DemoMessage
  value: 'Hello from pipeline variables'


parameters:
- name: message
  type: string
  default: 'Build running from template'

steps:
- script: |
    echo "${{ parameters.message }}"
    echo "Configuration: $(BuildConfiguration)"
    echo "Variable group value: $(CompanyEnvironment)"
  displayName: "Template Build Step"



        
