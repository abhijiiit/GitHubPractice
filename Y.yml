trigger:
- develop

pool:
  vmImage: ubuntu-latest

stages:


      - name: Trigger Azure DevOps Pipeline
        if: steps.folder_check.outputs.trigger_ado == 'true'
        shell: bash
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --user ":$AZURE_DEVOPS_PAT" \
            --header "Content-Type: application/json" \
            --data "{\"resources\":{\"repositories\":{\"self\":{\"refName\":\"refs/heads/${GITHUB_REF_NAME}\"}}}}" \
            "https://dev.azure.com/abhijitCICD/My%20CICD/_apis/pipelines/1/runs?api-version=7.1"



trigger: none
pr: none

parameters:
- name: Environment
  displayName: 'Environment'
  type: string
  default: 'Dev'
  values:
    - Dev
    - DEV
    - ITG
    - PROD
    - Pre-Prod

pool:
  name: 'codeway-aws-linux2023'

steps:
- bash: |
    echo "Deploying to ${{ parameters.Environment }}"
  displayName: 'Display selected environment'


# ---------------- CI WORKFLOW ----------------

trigger:
  branches:
    include:
      - DevOps_feature_Branch

pr: none

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: CheckAndRun
  displayName: 'Check folder and run tasks'
  steps:
  - checkout: self

  - bash: |
      if [ -d "Test_folder" ]; then
        echo "Test_folder exists. Skipping main tasks."
        echo "##vso[task.setvariable variable=skipTasks]true"
      else
        echo "Test_folder does not exist."
        echo "##vso[task.setvariable variable=skipTasks]false"
      fi
    displayName: 'Check Test_folder'

  - bash: |
      echo "Current date and time:"
      date

      echo "Agent details:"
      echo "Agent Name: $(Agent.Name)"
      echo "Agent OS: $(Agent.OS)"
      echo "Agent Machine: $(Agent.MachineName)"

      echo "Repository Name: $(Build.Repository.Name)"
      echo "Branch Name: $(Build.SourceBranchName)"
      echo "Full Branch Ref: $(Build.SourceBranch)"
    displayName: 'Print pipeline information'
    condition: and(succeeded(), eq(variables['skipTasks'
    ], 'false'))
