trigger:
- develop

pool:
  vmImage: ubuntu-latest

stages:

# ---------------- CI WORKFLOW ----------------

- stage: Build
  displayName: "CI - Build"
  jobs:
  - job: BuildJob
    steps:
    - script: echo "Build completed"
      displayName: "Build"

- stage: Test
  displayName: "CI - Test"
  dependsOn: Build
  jobs:
  - job: TestJob
    steps:
    - script: echo "Tests passed"
      displayName: "Test"

- stage: Publish
  displayName: "CI - Publish Artifact"
  dependsOn: Test
  jobs:
  - job: PublishJob
    steps:
    - script: echo "Artifact ready"
      displayName: "Publish"

# ---------------- CD WORKFLOW ----------------

- stage: Deploy_DEV
  displayName: "CD - Deploy DEV"
  dependsOn: Publish
  jobs:
  - job: DeployDevJob
    steps:
    - script: echo "Deployed to DEV"
      displayName: "Deploy DEV"

- stage: Deploy_UAT
  displayName: "CD - Deploy UAT"
  dependsOn: Deploy_DEV
  jobs:
  - job: DeployUatJob
    steps:
    - script: echo "Deployed to UAT"
      displayName: "Deploy UAT"

- stage: Deploy_PROD
  displayName: "CD - Deploy PROD"
  dependsOn: Deploy_UAT
  jobs:
  - job: DeployProdJob
    steps:
    - script: echo "Deployed to PROD"
      displayName: "Deploy PROD"
